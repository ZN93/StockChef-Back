openapi: 3.0.3
info: { title: La Cantinière API, version: 1.0.0 }
servers: [{ url: http://localhost:8080/api }]
paths:
  /produits:
    get:
      parameters:
        - in: query; name: search; schema: { type: string }
        - in: query; name: status; schema: { type: string, enum: [OK, PROCHES, PERIMES] }
        - in: query; name: page; schema: { type: integer, default: 0 }
        - in: query; name: size; schema: { type: integer, default: 20 }
      responses: { "200": { description: Liste paginée } }
    post:
      requestBody: { required: true }
      responses: { "201": { description: Créé }, "400": { description: Erreur validation } }
  /produits/{id}/stock:
    patch:
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true }
      responses: { "200": { description: OK }, "400": { description: Stock insuffisant } }
  /menus:
    post:
      requestBody: { required: true }
      responses: { "201": { description: Créé }, "400": { description: Règle métier } }
  /menus/{id}:
    get:
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK }, "404": { description: Introuvable } }
  /rapports:
    get:
      parameters: [{ in: query, name: from, required: true }, { in: query, name: to, required: true }]
      responses: { "200": { description: OK }, "400": { description: Dates invalides } }
